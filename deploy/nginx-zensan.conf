# Konfigurasi Nginx. Salin ke /etc/nginx/sites-available/zensan lalu ganti DOMAIN_ANDA.
# Certbot akan menambahkan bagian HTTPS sendiri.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_ANDA;

    root /home/zensan/zensan-cbt/web/dist;
    index index.html;

    # Berkas hasil build web punya nama unik, aman disimpan lama di browser
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API diteruskan ke Express (port 5000, hanya terbuka di dalam server)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 200k;
    }

    # Halaman aplikasi (React): semua alamat lain dilayani index.html, dan jangan di-cache
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
